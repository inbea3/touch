name: TouchScale nine-episode contact and sampling QC

on:
  workflow_dispatch:
  push:
    branches:
      - thesis-few-shot-structure-20261125
    paths:
      - scripts/run_touchscale_nine_episode_qc.py
      - .github/workflows/touchscale-nine-episode-qc.yml

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thesis-few-shot-structure-20261125
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade numpy pandas pyarrow h5py huggingface_hub fsspec aiohttp requests
      - name: Run nine-episode contact and sampling-rate audit
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/run_touchscale_nine_episode_qc.py
      - name: Upload QC outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchscale-nine-episode-qc
          path: artifacts/touchscale_nine_episode_qc/
          if-no-files-found: warn
