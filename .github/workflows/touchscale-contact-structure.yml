name: TouchScale contact-conditioned structure audit

on:
  workflow_dispatch:
  push:
    branches:
      - thesis-few-shot-structure-20261125
    paths:
      - scripts/audit_touchscale_contact_conditioned_structure.py
      - scripts/audit_touchscale_signal_300.py
      - configs/touchscale_signal_audit_300_shards.txt
      - .github/workflows/touchscale-contact-structure.yml

permissions:
  contents: read

jobs:
  contact-structure-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thesis-few-shot-structure-20261125
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy pandas pyarrow h5py huggingface_hub
      - name: Audit contact-conditioned early-to-late pad structure
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/audit_touchscale_contact_conditioned_structure.py
      - name: Upload contact-conditioned structure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchscale-contact-conditioned-structure-audit
          path: artifacts/touchscale_contact_conditioned_structure/
          if-no-files-found: warn
