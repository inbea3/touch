name: HAS MLP baselines

on:
  workflow_dispatch:
    inputs:
      feature_run_id:
        description: "Verified Stage 19 feature artifact run ID"
        required: true
        default: "45115559336"
        type: string
      epochs:
        description: "Maximum epochs per task and seed"
        required: true
        default: "200"
        type: string
      seeds:
        description: "Comma-separated initialization seeds"
        required: true
        default: "20261123,20261124,20261125"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: has-mlp-baselines
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/old-research-assets
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download verified Stage 19 feature artifact
        uses: actions/download-artifact@v4
        with:
          name: has-pressure-feature-dataset-${{ inputs.feature_run_id }}
          run-id: ${{ inputs.feature_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: inbea3/touch
          path: results/has_feature_dataset
      - name: Verify input artifact checksums
        run: |
          cd results/has_feature_dataset
          sha256sum -c manifest.sha256
      - name: Install training dependencies
        run: python -m pip install --upgrade pip numpy scipy torch
      - name: Train object-disjoint MLP baselines
        env:
          EPOCHS: ${{ inputs.epochs }}
          SEEDS: ${{ inputs.seeds }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/run_has_mlp_baselines.py
          python scripts/run_has_mlp_baselines.py --epochs "${EPOCHS}" --seeds "${SEEDS}"
      - name: Upload checkpoints, traces, metrics and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: has-mlp-baselines-${{ github.run_id }}
          path: results/has_mlp_baseline/
          if-no-files-found: warn
          retention-days: 90
