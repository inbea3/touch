name: TouchScale task-family pilot shard preflight

on:
  workflow_dispatch:
  push:
    branches:
      - thesis-few-shot-structure-20261125
    paths:
      - scripts/preflight_touchscale_pilot_shards.py
      - .github/workflows/touchscale-task-family-preflight.yml

permissions:
  contents: read

jobs:
  shard-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thesis-few-shot-structure-20261125
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install metadata dependencies
        run: python -m pip install --upgrade pandas pyarrow huggingface_hub
      - name: Estimate selected shard download footprint
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/preflight_touchscale_pilot_shards.py
      - name: Upload preflight manifest and size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchscale-task-family-pilot-preflight
          path: artifacts/touchscale_pilot_preflight/
          if-no-files-found: warn
