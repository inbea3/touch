name: TouchScale six-episode three-participant pilot

on:
  workflow_dispatch:
  push:
    branches:
      - thesis-few-shot-structure-20261125
    paths:
      - scripts/run_touchscale_six_episode_pilot.py
      - .github/workflows/touchscale-six-episode-pilot.yml

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thesis-few-shot-structure-20261125
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade numpy pandas pyarrow h5py huggingface_hub fsspec aiohttp requests
      - name: Extract balanced six-episode pilot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/run_touchscale_six_episode_pilot.py
      - name: Upload six-episode results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchscale-six-episode-pilot
          path: artifacts/touchscale_six_episode_pilot/
          if-no-files-found: warn
