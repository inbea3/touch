name: TouchScale tactile signal pilot

on:
  workflow_dispatch:
  push:
    branches:
      - thesis-few-shot-structure-20261125
    paths:
      - scripts/audit_touchscale_signal_pilot.py
      - requirements-touchscale-audit.txt
      - .github/workflows/touchscale-signal-pilot.yml

permissions:
  contents: read

jobs:
  signal-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thesis-few-shot-structure-20261125
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install signal audit dependencies
        run: python -m pip install numpy pandas h5py huggingface_hub
      - name: Stream one selected TouchScale shard and audit seven episodes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/audit_touchscale_signal_pilot.py
      - name: Upload signal audit report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchscale-signal-pilot
          path: artifacts/touchscale_signal_pilot/
          if-no-files-found: warn
