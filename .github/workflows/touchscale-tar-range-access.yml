name: TouchScale remote tar range-access proof

on:
  workflow_dispatch:
  push:
    branches:
      - thesis-few-shot-structure-20261125
    paths:
      - scripts/test_touchscale_tar_range_access.py
      - .github/workflows/touchscale-tar-range-access.yml

permissions:
  contents: read

jobs:
  range-access:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thesis-few-shot-structure-20261125
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install range access dependencies
        run: python -m pip install --upgrade pandas pyarrow huggingface_hub fsspec h5py
      - name: Read one HDF5 episode from remote tar using HTTP ranges
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/test_touchscale_tar_range_access.py
      - name: Upload range access proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchscale-tar-range-access-proof
          path: artifacts/touchscale_range_access/
          if-no-files-found: warn
