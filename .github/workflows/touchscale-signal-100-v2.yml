name: TouchScale 100-episode signal audit v2

on:
  workflow_dispatch:
  push:
    branches:
      - thesis-few-shot-structure-20261125
    paths:
      - scripts/audit_touchscale_signal_100_v2.py
      - configs/touchscale_signal_sample_100.tsv
      - .github/workflows/touchscale-signal-100-v2.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thesis-few-shot-structure-20261125
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy pandas h5py huggingface_hub
      - name: Audit raw tactile and cross-check episode metadata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/audit_touchscale_signal_100_v2.py
      - name: Upload v2 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchscale-signal-audit-100-v2
          path: artifacts/touchscale_signal_100_v2/
          if-no-files-found: warn
