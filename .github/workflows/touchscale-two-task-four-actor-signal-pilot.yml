name: TouchScale two-task four-actor signal pilot

on:
  workflow_dispatch:
  push:
    branches:
      - thesis-few-shot-structure-20261125
    paths:
      - scripts/run_touchscale_two_task_four_actor_signal_pilot.py
      - scripts/extract_touchscale_dynamic_structure.py
      - .github/workflows/touchscale-two-task-four-actor-signal-pilot.yml

permissions:
  contents: read

jobs:
  signal-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thesis-few-shot-structure-20261125
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install metadata and signal dependencies
        run: python -m pip install --upgrade numpy pandas pyarrow h5py huggingface_hub fsspec aiohttp
      - name: Extract selected HDF5 episodes and audit tactile structure
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/run_touchscale_two_task_four_actor_signal_pilot.py
      - name: Upload aggregate signal and feature audit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchscale-two-task-four-actor-signal-pilot
          path: artifacts/touchscale_two_task_four_actor_signal_pilot/
          if-no-files-found: warn
