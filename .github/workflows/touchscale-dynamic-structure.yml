name: TouchScale dynamic tactile structure representation

on:
  workflow_dispatch:
  push:
    branches:
      - thesis-few-shot-structure-20261125
    paths:
      - scripts/extract_touchscale_dynamic_structure.py
      - scripts/audit_touchscale_signal_300.py
      - configs/touchscale_signal_audit_300_shards.txt
      - .github/workflows/touchscale-dynamic-structure.yml

permissions:
  contents: read

jobs:
  dynamic-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thesis-few-shot-structure-20261125
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy pandas pyarrow h5py huggingface_hub pytest
      - name: Unit-test dynamic feature definitions
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("dyn", "scripts/extract_touchscale_dynamic_structure.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          import numpy as np
          p = np.zeros(15); p[0] = 0.5; p[1] = 0.5
          q = np.zeros(15); q[0] = 1.0
          assert abs(m.js_divergence(p, p)) < 1e-12
          assert m.js_divergence(p, q) > 0
          assert abs(m.distribution_metrics(p)["top3_share"] - 1.0) < 1e-12
          ids, edges = m.make_time_bins(np.arange(100, dtype=float))
          assert len(ids) == 100 and len(edges) == 11 and ids.min() == 0 and ids.max() == 9
          print("dynamic feature unit checks passed")
          PY
      - name: Extract dynamic tactile structure from fixed deterministic 300 sample
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/extract_touchscale_dynamic_structure.py
      - name: Upload dynamic structure features
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchscale-dynamic-structure-features
          path: artifacts/touchscale_dynamic_structure/
          if-no-files-found: warn
