name: Reptile adaptation and task-compatibility diagnostics

on:
  push:
    branches:
      - integration/old-research-assets
    paths:
      - "scripts/diagnose_reptile_adaptation.py"
      - ".github/workflows/reptile-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out research code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies
        run: python -m pip install -r requirements-models.txt
      - name: Download the exact selected-validation checkpoints and scaler
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          run_id: 44502406385
          name: reptile-selected-validation-44502406385-1
          path: /tmp/reptile-checkpoints
          skip_unpack: false
      - name: Download official pressure-only STAG archive
        run: python scripts/download_dataset.py --output data/raw/classification_lite.zip
      - name: Extract and audit metadata
        run: |
          python scripts/audit_dataset.py \
            --archive data/raw/classification_lite.zip \
            --extract-to data/interim \
            --output-dir /tmp/stag-data-audit
          test -s data/interim/metadata.mat
      - name: Verify checkpoint and scaler files
        run: |
          test -s /tmp/reptile-checkpoints/reptile-selected-validation/reptile_seed_20261116.pt
          test -s /tmp/reptile-checkpoints/reptile-selected-validation/support_matched_mlp_seed_20261116.pt
          test -s /tmp/reptile-checkpoints/reptile-selected-validation/ordinary_mlp_seed_20261116.pt
          test -s /tmp/reptile-checkpoints/reptile-selected-validation/feature_scaler.npz
          python -m py_compile scripts/diagnose_reptile_adaptation.py
      - name: Run fixed-episode adaptation and task-direction diagnostics
        run: |
          python scripts/diagnose_reptile_adaptation.py \
            --metadata data/interim/metadata.mat \
            --split-manifest results/object_episode_splits/object_split_manifest.json \
            --checkpoint-dir /tmp/reptile-checkpoints/reptile-selected-validation \
            --scaler-npz /tmp/reptile-checkpoints/reptile-selected-validation/feature_scaler.npz \
            --output-dir /tmp/reptile-diagnostics \
            --seeds 20261116,20261117,20261118 \
            --nodes 96 \
            --sensor-seed 20261116 \
            --inner-steps 10 \
            --inner-lr 0.001 \
            --weight-decay 0.001 \
            --batch-size 1024 \
            --device cpu
      - name: Verify diagnostic outputs
        run: |
          test -s /tmp/reptile-diagnostics/adaptation_episode_metrics.csv
          test -s /tmp/reptile-diagnostics/adaptation_object_seed_metrics.csv
          test -s /tmp/reptile-diagnostics/adaptation_object_metrics.csv
          test -s /tmp/reptile-diagnostics/task_direction_object_metrics.csv
          test -s /tmp/reptile-diagnostics/task_direction_pairwise_cosines.csv
          test -s /tmp/reptile-diagnostics/diagnostic_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/reptile-diagnostics/diagnostic_summary.json')
          x = json.loads(p.read_text())
          assert len(x['validation_objects']) == 4
          assert len(x['meta_train_objects']) == 18
          assert set(x['task_direction_cosine_by_seed']) == {'20261116','20261117','20261118'}
          print('DIAGNOSTIC_OUTPUTS_VERIFIED')
          print(json.dumps(x['task_direction_cosine_by_seed'], indent=2))
          PY
      - name: Upload diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reptile-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/reptile-diagnostics/
            /tmp/stag-data-audit/
          if-no-files-found: warn
          retention-days: 30
