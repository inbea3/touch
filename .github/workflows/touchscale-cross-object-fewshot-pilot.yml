name: TouchScale cross-object few-shot adaptation pilot
# Re-run after removing one unverifiable Episode from the candidate manifest.
# Pilot uses authoritative metadata to resolve all episode shard locations.

on:
  workflow_dispatch:
  push:
    branches:
      - thesis-few-shot-structure-20261125
    paths:
      - scripts/run_touchscale_cross_object_fewshot_pilot.py
      - .github/workflows/touchscale-cross-object-fewshot-pilot.yml

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thesis-few-shot-structure-20261125
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade numpy pandas pyarrow h5py huggingface_hub fsspec aiohttp requests scikit-learn
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run TouchScale cross-object few-shot pilot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/run_touchscale_cross_object_fewshot_pilot.py
      - name: Upload pilot metrics and audit (no raw pressure arrays)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchscale-cross-object-fewshot-pilot
          path: artifacts/touchscale_cross_object_fewshot_pilot/
          if-no-files-found: warn
