name: HAS pressure feature dataset

on:
  workflow_dispatch:
    inputs:
      split_run_id:
        description: "Successful object-grouped split workflow run ID"
        required: true
        default: "45112395632"
        type: string
      revision:
        description: "Optional immutable Hugging Face dataset commit SHA (blank resolves and pins latest at run start)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: has-pressure-feature-dataset
  cancel-in-progress: false

jobs:
  build-features:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: integration/old-research-assets
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download locked object split artifact
        uses: actions/download-artifact@v4
        with:
          name: has-object-grouped-split-${{ inputs.split_run_id }}
          run-id: ${{ inputs.split_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: inbea3/touch
          path: results/has_object_grouped_split
      - name: Install dependencies
        run: python -m pip install --upgrade pip datasets numpy huggingface_hub
      - name: Verify split artifact and build features
        shell: bash
        env:
          DATASET_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          test -s results/has_object_grouped_split/episode_split_manifest.csv
          test -s results/has_object_grouped_split/object_split_manifest.csv
          ARGS=(--split-manifest results/has_object_grouped_split/episode_split_manifest.csv
                --object-manifest results/has_object_grouped_split/object_split_manifest.csv
                --out results/has_feature_dataset)
          if [[ -n "${DATASET_REVISION}" ]]; then ARGS+=(--revision "${DATASET_REVISION}"); fi
          python -m py_compile scripts/build_has_pressure_features.py
          python scripts/build_has_pressure_features.py "${ARGS[@]}"
      - name: Upload feature dataset and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: has-pressure-feature-dataset-${{ github.run_id }}
          path: results/has_feature_dataset/
          if-no-files-found: warn
          retention-days: 90
