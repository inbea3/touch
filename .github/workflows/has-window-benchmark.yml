name: HAS matched window benchmark

on:
  workflow_dispatch:
    inputs:
      window_run_id:
        description: "Successful matched window dataset run ID"
        required: true
        default: "45193420854"
        type: string
      ridge_alphas:
        description: "Ridge alpha candidates"
        required: true
        default: "0.1,1,10,100,1000"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: has-window-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/old-research-assets
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download matched window dataset
        uses: actions/download-artifact@v4
        with:
          name: has-window-dataset-${{ inputs.window_run_id }}
          run-id: ${{ inputs.window_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: inbea3/touch
          path: results/has_window_dataset
      - name: Verify source data checksums
        run: |
          cd results/has_window_dataset
          sha256sum -c manifest.sha256
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy scikit-learn
      - name: Run matched-window benchmark
        env:
          ALPHAS: ${{ inputs.ridge_alphas }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/run_has_window_benchmark.py
          python scripts/run_has_window_benchmark.py --alphas "${ALPHAS}"
      - name: Upload benchmark results and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: has-window-benchmark-${{ github.run_id }}
          path: results/has_window_benchmark/
          if-no-files-found: warn
          retention-days: 90
